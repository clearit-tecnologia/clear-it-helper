{{- if and .Values.components.app.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "ch.labels" (dict "ctx" . "component" "app") | nindent 4 }}
# The workloads do not call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
