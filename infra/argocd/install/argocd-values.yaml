# Values for the Argo CD chart (argo/argo-cd), installed by scripts/dev-up.sh
# (mvp: same values via `helm upgrade --install`, see infra/README.md).
global:
  domain: argocd.clear-helper.localhost

configs:
  params:
    # TLS is terminated by the ingress (or not used at all in dev, via port-forward).
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # Health assessment of child Applications, required for app-of-apps sync waves
    # (operators -> data -> app) to actually wait for the previous wave.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

dex:
  enabled: false

notifications:
  enabled: false

server:
  ingress:
    enabled: false
