{{- if .Values.secretsApp.enabled }}
# SealedSecrets committed in Git for this environment (wave 1: before the data layer).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clear-helper-secrets
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ include "apps.repoURL" . }}
    targetRevision: {{ include "apps.targetRevision" . }}
    path: {{ .Values.secretsApp.path }}
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.appNamespace }}
  {{- include "apps.syncPolicy" (dict "ctx" .) | nindent 2 }}
{{- end }}
