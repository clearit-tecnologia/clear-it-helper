{{- range .Values.ociRepositories }}
---
apiVersion: v1
kind: Secret
metadata:
  name: repo-{{ .name }}
  namespace: {{ $.Values.argocdNamespace }}
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  name: {{ .name }}
  type: helm
  url: {{ .url }}
  enableOCI: "true"
{{- end }}
