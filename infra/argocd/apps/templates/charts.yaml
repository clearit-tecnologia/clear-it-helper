{{- /* Third-party charts: chart source + value files from this repository ($values). */ -}}
{{- range $name, $c := .Values.components }}
{{- if eq (include "apps.enabled" (dict "ctx" $ "component" $c)) "true" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $c.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project }}
  sources:
    - repoURL: {{ $c.repoURL }}
      chart: {{ $c.chart }}
      targetRevision: {{ $c.version | quote }}
      helm:
        releaseName: {{ $c.releaseName }}
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/infra/values/common/{{ $c.valuesFile }}
          - $values/infra/values/{{ $.Values.env }}/{{ $c.valuesFile }}
    - repoURL: {{ include "apps.repoURL" $ }}
      targetRevision: {{ include "apps.targetRevision" $ }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ default $.Values.appNamespace $c.namespace }}
  {{- if $c.ignoreWebhookCaBundle }}
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  {{- end }}
  {{- $extra := ternary (list "RespectIgnoreDifferences=true") (list) (default false $c.ignoreWebhookCaBundle) }}
  {{- include "apps.syncPolicy" (dict "ctx" $ "extraOptions" $extra) | nindent 2 }}
{{- end }}
{{- end }}
