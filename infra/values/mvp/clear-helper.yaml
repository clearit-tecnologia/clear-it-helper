# clear-helper chart overrides for the on-prem mvp environment.
image:
  # Harbor on-prem. TODO: set the real Harbor host/project.
  registry: harbor.CHANGE-ME.local/clear-helper
  # Immutable tag published by the release pipeline (SemVer or commit SHA).
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  # Create this docker-registry Secret (sealed) if Harbor requires authentication.
  pullSecrets: []

config:
  env: mvp
  logLevel: INFO
  # TODO: set the real public host.
  corsOrigins: https://clear-helper.CHANGE-ME.local
  bootstrap:
    tenant: ClearIT
    adminEmail: admin@clearit.com.br

ingress:
  host: clear-helper.CHANGE-ME.local
  type: traefik
  entryPoints: ["websecure"]
  tls:
    enabled: true
    # TODO: TLS Secret issued by the customer's PKI (sealed in infra/secrets/mvp).
    secretName: clear-helper-tls

networkPolicy:
  enabled: true
  ingressNamespace: kube-system

api:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

worker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 8Gi}

frontend:
  replicas: 2

postgres:
  instances: 2
  storage:
    size: 50Gi
    storageClass: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}

langfuse:
  postgres:
    instances: 1
    storageSize: 20Gi

redis:
  maxmemory: 1gb
  storage:
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1536Mi}

garage:
  # 200 GiB announced; keep <= dataSize.
  capacityBytes: 214748364800
  storage:
    metaSize: 10Gi
    dataSize: 200Gi
