[project]
name = "clear-helper-eval"
version = "0.1.0"
description = "clear-helper evaluation: golden set, corpus fetcher and retrieval/answer metrics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
    # RAGAS (optional at runtime: only used with --ragas). The judge is reached through the
    # OpenAI-compatible endpoint of the local LiteLLM proxy (never a cloud provider).
    "ragas>=0.4,<0.5",
    "openai>=1.50",
    "langchain-openai>=0.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.x
    "langchain-community>=0.3,<0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "RET"]
ignore = [
    "S101", # asserts are fine in tests and scripts
    "RUF001", "RUF002", "RUF003", # pt-BR text uses ordinal indicators and typographic quotes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
