# Corpus do golden set v1 (Fase 1): normas públicas federais.
#
# Licença: textos de leis são de domínio público. A Lei 9.610/1998 (Direitos Autorais),
# art. 8º, IV, exclui da proteção autoral "os textos de tratados ou convenções, leis, decretos,
# regulamentos, decisões judiciais e demais atos oficiais". Uso comercial e redistribuição livres.
#
# Fonte: portal da legislação da Presidência da República (planalto.gov.br). A página de cada lei
# é o TEXTO COMPILADO: incorpora as alterações posteriores e mantém a redação antiga riscada
# (<strike>/line-through). O fetch_corpus.py remove a redação riscada e gera o texto VIGENTE,
# preservando as notas de alteração, ex.: "(Redação dada pela Lei nº 13.853, de 2019)".
#
# Formato gerado: TXT UTF-8, um dispositivo (artigo, parágrafo, inciso, alínea) por linha,
# sem menus, scripts ou estilos. TXT foi escolhido porque a baseline o aceita (página = 1),
# a extração é determinística e o mesmo arquivo serve para validar os quotes literais.
#
# sha256: hash do arquivo .txt CONVERTIDO (é o arquivo enviado à API). O HTML bruto não serve
# como trava porque o WAF do Planalto injeta um <script> aleatório a cada download; o hash do
# bruto fica só no manifesto (files/manifest.json). Se o Planalto publicar nova redação, o hash
# muda: rode `fetch_corpus.py`, depois o validador do golden set, e só então `--update-lock`.
